<!DOCTYPE html>
<html lang="en">
<head>
  <script src="assets/api-base.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In | CWS Multimedia Connect</title>
  <meta name="description" content="Log in to CWS Multimedia Connect to manage your design orders and account." />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-277GPFBX9Z"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-277GPFBX9Z');
</script>
  
  <meta name="theme-color" content="#0b0e13" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <script src="assets/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="assets/guide.css" />
</head>
<body class="auth-page">
  <button type="button" class="theme-toggle" style="position:fixed;right:14px;top:14px;z-index:20;background:var(--surface)" aria-label="Switch theme" aria-pressed="false"><svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg><svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <div class="auth-shell">
    <aside class="auth-showcase" aria-label="CWS portfolio showcase">
      <div class="showcase-top">
        <div class="mini-badge"><span class="mini-dot"></span> Creative Studio</div>
        <div class="mini-badge">Kadoma, Zimbabwe</div>
      </div>

      <div class="showcase-grid">
        <div class="showcase-card large"></div>
        <div class="showcase-card medium"></div>
        <div class="showcase-card small"></div>
        <div class="showcase-card tiny"></div>

        <div class="floating-tag tag-1">Event Flyers</div>
        <div class="floating-tag tag-2">Brand Identity</div>
        <div class="floating-tag tag-3">Concert Art</div>
        <div class="floating-tag tag-4">Merch Design</div>

        <span class="showcase-node node-1"></span>
        <span class="showcase-node node-2"></span>
        <span class="showcase-node node-3"></span>
      </div>

      <div class="showcase-footer">
        <h2>Build together, faster</h2>
        <p>High Quality Visuals for Brands & Events</p>
      </div>
    </aside>

    <main id="main" class="auth-panel">
      <div class="auth-card">
        <div class="auth-brand">
          <span class="brand-logo" role="img" aria-label="CWS Multimedia Connect"></span>
        </div>

        <div class="auth-header">
          <p class="eyebrow">Creative workspace</p>
          <h1>Welcome to CWS Multimedia</h1>
        </div>

        <form id="loginForm" class="auth-form">
          <div>
            <label for="loginEmail">Email address</label>
            <input id="loginEmail" name="email" type="email" placeholder="name@example.com" required />
          </div>

          <div>
            <label for="loginPassword">Password</label>
            <input id="loginPassword" name="password" type="password" placeholder="Enter your password" required />
          </div>

          <div class="form-message" aria-live="polite"></div>

          <button type="submit" class="primary-btn">Log in</button>
          <p class="switch-link" id="forgotWrap" hidden style="margin-top:12px"><a href="#" id="forgotLink">Forgot your password?</a></p>
        </form>

        <p class="switch-link">Don't you have an account? <a href="signup.html">Sign up</a></p>
      </div>
    </main>
  </div>
  <script src="assets/firebase-config.js"></script>
  <script type="module" src="assets/firebase-auth.js"></script>
  <script src="script.js"></script>
  <script src="assets/guide-kb.js"></script>
  <script src="assets/site.js"></script>
  <script src="assets/guide.js"></script>
  <script>
    document.addEventListener('cws-firebase-ready', function () {
      var fb = window.cwsFirebase; if (!fb || !fb.enabled) return;
      var wrap = document.getElementById('forgotWrap'), form = document.getElementById('loginForm'), msg = form.querySelector('.form-message');
      wrap.hidden = false;
      document.getElementById('forgotLink').addEventListener('click', function (e) {
        e.preventDefault();
        var email = document.getElementById('loginEmail').value.trim();
        if (!email) { msg.textContent = 'Type your email above first, then press Forgot your password.'; return; }
        fb.resetPassword(email).then(function () { msg.textContent = 'If that email has an account, a reset link is on its way.'; })
          .catch(function (err) { msg.textContent = fb.explain(err); });
      });
    });
  </script>
  <script src="assets/auth-nav.js"></script>
  <script src="assets/track.js"></script>
</body>
</html>
